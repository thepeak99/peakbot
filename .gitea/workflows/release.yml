name: release

on:
  push:
    tags: ['*']

jobs:
  release:
    name: build + publish (8 assets)
    runs-on: dind
    timeout-minutes: 300
    # Runs on the Alpine host: it drives the HOST docker daemon (the dind
    # runner ships docker) and the pure-git checkout needs only git + sh.
    # No job-level container — bind mounts are unsafe on this runner.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Gitea forbids secret names starting with GITEA_, hence the mapping.
      GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - name: Checkout (no-node, pure git)
        run: |
          git init -q
          git fetch --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Check required tools and release token (no installs — add missing tools to the runner image)
        run: |
          for t in make curl jq docker git awk; do
            command -v "$t" >/dev/null || { echo "missing tool on runner: $t (add it to the runner image)"; exit 1; }
          done
          [ -n "$GITEA_TOKEN" ] || { echo "RELEASE_TOKEN secret missing/empty" >&2; exit 1; }
      - name: Release (check, build 8 assets, publish)
        run: |
          # No `origin` remote after the pure-git checkout — the Makefile
          # derives GITEA_URL/OWNER/REPO from it, so pass them explicitly.
          make release TAG="$GITHUB_REF_NAME" PRUNE=1 CONTAINER_BUILDER=docker GITEA_URL="$GITHUB_SERVER_URL" OWNER="${GITHUB_REPOSITORY%/*}" REPO="${GITHUB_REPOSITORY#*/}"
