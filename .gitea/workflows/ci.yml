name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: dind
    timeout-minutes: 30
    container: rust:1.95

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout (no-node, pure git)
        run: |
          git init -q
          git fetch --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      # Release-pipeline contract tests (Makefile targets + .gitea/workflows/
      # release.yml): fast, no docker builds — run before the cargo gate.
      # rust:1.95 lacks jq. The suite sets its own git identity in the
      # throwaway clones.
      - name: Release pipeline contract tests
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends jq
          sh tests/release.sh
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      # Frontend gate first so `web/dist/` is populated before the Rust
      # build inlines it via rust-embed. webui.md §4.3: CI must run a
      # real Node frontend gate; the build.rs stub is only a node-free
      # convenience for backend-only contributors and never ships here.
      - name: Install Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
      - name: Frontend gate
        run: |
          cd web
          npm ci
          npm run lint
          npm run typecheck
          npm test --if-present
          npm run build
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          # No `--workspace`: default-members is the root crate (the mobile
          # crate joins the workspace) — the ci job never needs
          # webkit, and the mobile crate is checked in the `desktop` job.
          cargo test --locked
      # Local edition: the core without the `host` feature, as phones embed
      # it. The canary test exists only in that build, so anything but
      # `1 passed` means `host` leaked back in through a dependency edge.
      - name: Rust checks (Local edition)
        run: |
          set -eu
          cargo clippy --locked --lib --no-default-features -- -D warnings
          cargo test --locked --lib --no-default-features
          cargo test --locked --lib --no-default-features local_edition_canary -- --exact | tee /tmp/canary.log
          grep -q 'test result: ok. 1 passed' /tmp/canary.log

  # Full desktop workspace (core + Tauri glue). The glue needs the webkit2gtk
  # system deps (same set as Dockerfile.desktop-linux); no node/web build —
  # frontendDist desktop/ui is committed static files.
  desktop:
    name: desktop (core + Tauri glue)
    runs-on: dind
    timeout-minutes: 45
    container: rust:1.95

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout (no-node, pure git)
        run: |
          git init -q
          git fetch --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      # Tauri 2 Linux prerequisites (same set as Dockerfile.desktop-linux).
      # file + llvm: the Windows desktop static tests unit-test
      # smoke-windows.sh against fake PEs (it needs file + llvm-objdump).
      # 7zip: S-W6 inspects the NSIS installer archive (it needs 7z).
      - name: Install webkit/Tauri system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            file llvm 7zip
      - name: Desktop fmt + clippy + test
        run: |
          # tauri-build fails if bundle.externalBin is missing; a placeholder suffices for check builds.
          touch "desktop/src-tauri/binaries/peakbot-$(rustc -vV | sed -n 's/host: //p')"
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop/Cargo.toml --workspace
      # Mobile crate (peakbot-mobile): member of the root workspace, so both
      # checks run from the repo root against the shared lock. The
      # webkit/gtk deps installed above already cover the Tauri glue; `cargo
      # fmt` needs no step here — the root `ci` job runs `cargo fmt --all`,
      # which includes this member.
      - name: Mobile clippy + test
        run: |
          cargo clippy --locked -p peakbot-mobile --all-targets -- -D warnings
          cargo test --locked -p peakbot-mobile
          sh mobile/tests/contracts.sh
      # Static tests for the Windows desktop pipeline (T01–T48): shell
      # contract checks on build-desktop.sh / the Dockerfiles / the Makefile,
      # plus smoke-windows.sh unit-tested against fake PEs. No docker build.
      - name: Windows desktop static tests
        run: sh desktop/scripts/test-build-desktop-windows.sh
      # Auto-updater pipeline contract tests: latest.json manifest
      # (updater-manifest.sh) + the .app.tar.gz layout (assemble-app.sh,
      # rcodesign stubbed by the tests themselves). Hermetic; jq + zip from
      # apt (rust:1.95 ships neither).
      - name: Updater + macOS tarball contract tests
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends jq zip
          sh desktop/scripts/test-updater-manifest.sh
          sh desktop/scripts/test-assemble-app-tarball.sh

  # Local edition on the real Android target: the `peakbot` lib without the
  # `host` feature, cross-checked for arm64-v8a inside the mobile toolchain
  # image (Dockerfile.mobile-android, `toolchain` stage).
  #
  # Runs on the Alpine host like release.yml — the `ci`/`desktop` jobs use a
  # job-level `container:` (rust:1.95), which has no docker CLI or daemon
  # access and cannot build/run containers. Here the host docker (the dind
  # runner ships it) does both.
  local-android:
    name: local-android (NDK check of the Local edition)
    runs-on: dind
    timeout-minutes: 60

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout (no-node, pure git)
        run: |
          git init -q
          git fetch --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Check required tools
        run: |
          for t in docker git; do
            command -v "$t" >/dev/null || { echo "missing tool on runner: $t (add it to the runner image)"; exit 1; }
          done
      # BuildKit (docker 27 default) caches the image layers across runs; the
      # `--mount=type=cache` in the Dockerfile keeps the cargo registry warm
      # across image rebuilds.
      - name: Build the toolchain image (BuildKit-cached)
        run: docker build -f Dockerfile.mobile-android --target toolchain -t localhost/peakbot-mobile-android:toolchain .
      # Named volumes keep the crate registry and the target dir warm between
      # PRs (fresh per run otherwise); the worktree is bind-mounted, so no
      # source is baked into the image.
      - name: cargo ndk check (Local edition, arm64-v8a)
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v pbm-cargo-reg:/opt/cargo/registry \
            -v pbm-cargo-target:/work/target \
            localhost/peakbot-mobile-android:toolchain \
            cargo ndk -t arm64-v8a check --locked -p peakbot --lib --no-default-features
