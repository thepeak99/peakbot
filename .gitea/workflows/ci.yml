name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: dind
    timeout-minutes: 30
    container: rust:1.95

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout (no-node, pure git)
        run: |
          git init -q
          git fetch --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      # Release-pipeline contract tests (Makefile targets + .gitea/workflows/
      # release.yml): fast, no docker builds — run before the cargo gate.
      # rust:1.95 lacks jq. The suite sets its own git identity in the
      # throwaway clones.
      - name: Release pipeline contract tests
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends jq
          sh tests/release.sh
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      # Frontend gate first so `web/dist/` is populated before the Rust
      # build inlines it via rust-embed. webui.md §4.3: CI must run a
      # real Node frontend gate; the build.rs stub is only a node-free
      # convenience for backend-only contributors and never ships here.
      - name: Install Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
      - name: Frontend gate
        run: |
          cd web
          npm ci
          npm run lint
          npm run typecheck
          npm test --if-present
          npm run build
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # Full desktop workspace (core + Tauri glue). The glue needs the webkit2gtk
  # system deps (same set as Dockerfile.desktop-linux); no node/web build —
  # frontendDist desktop/ui is committed static files.
  desktop:
    name: desktop (core + Tauri glue)
    runs-on: dind
    timeout-minutes: 45
    container: rust:1.95

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout (no-node, pure git)
        run: |
          git init -q
          git fetch --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install rustfmt + clippy
        run: rustup component add rustfmt clippy
      # Tauri 2 Linux prerequisites (same set as Dockerfile.desktop-linux).
      # file + llvm: the Windows desktop static tests unit-test
      # smoke-windows.sh against fake PEs (it needs file + llvm-objdump).
      # 7zip: S-W6 inspects the NSIS installer archive (it needs 7z).
      - name: Install webkit/Tauri system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            file llvm 7zip
      - name: Desktop fmt + clippy + test
        run: |
          # tauri-build fails if bundle.externalBin is missing; a placeholder suffices for check builds.
          touch "desktop/src-tauri/binaries/peakbot-$(rustc -vV | sed -n 's/host: //p')"
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path desktop/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --locked --manifest-path desktop/Cargo.toml --workspace
      # Static tests for the Windows desktop pipeline (T01–T48): shell
      # contract checks on build-desktop.sh / the Dockerfiles / the Makefile,
      # plus smoke-windows.sh unit-tested against fake PEs. No docker build.
      - name: Windows desktop static tests
        run: sh desktop/scripts/test-build-desktop-windows.sh
