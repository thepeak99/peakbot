<!-- peakbot-desktop-settings-page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PeakBot Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --fg: #1c1c1a;
        --muted: #6b6b66;
        --accent: #0f6b4f;
        --accent-fg: #ffffff;
        --danger: #b3372f;
        --border: #d9d9d4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1a;
          --fg: #ececea;
          --muted: #9a9a93;
          --accent: #2ea37a;
          --accent-fg: #08130e;
          --danger: #e0645c;
          --border: #3a3a36;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 1.5rem 2rem 3rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 1rem;
      }
      .row {
        margin: 0 0 1.25rem;
      }
      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        cursor: pointer;
      }
      .controls label:has(input:disabled),
      .row.disabled .controls label {
        opacity: 0.5;
        cursor: default;
      }
      .note {
        margin: 0.4rem 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1.5rem 0;
      }
      #back {
        font: inherit;
        padding: 0.5rem 1.1rem;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
      }
      #back:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Settings</h1>
      <p id="no-tauri" class="error" hidden>Internal error: no Tauri API</p>
      <div id="page" hidden>
        <div class="row" id="row-background">
          <div class="controls">
            <label><input type="checkbox" id="background" /> Keep PeakBot running in background</label>
          </div>
          <p class="note">Applies immediately.</p>
        </div>
        <hr />
        <p class="note">
          Web server settings (address, HTTPS, access token) live in
          PeakBot → Settings → General.
        </p>
        <button id="back" type="button">← Back to PeakBot</button>
      </div>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
