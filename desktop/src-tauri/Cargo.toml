[package]
name = "peakbot-desktop"
version.workspace = true
edition.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
# zstd + sha2 run in build.rs (the payload packer) on EVERY host: a build
# script can't cfg on the target, so the Linux/macOS builds compile
# zstd-sys once (~20 s) and never use it at runtime (DESIGN amendment
# (windows-portable)).
zstd = "0.13"
sha2 = "0.10"

[dependencies]
peakbot-desktop-core = { path = "../core" }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
# Updater (spike S2): rustls TLS (no aws-lc/cmake in the graph) +
# system proxies; `zip` dropped — we ship a raw AppImage, a raw
# setup.exe and a .app.tar.gz (tar/flate2 are unconditional on macOS).
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
# generate_context! embeds the (plugin) config and names serde_json.
serde_json = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# Pure-Rust zstd decoder for the embedded sidecar payload: no C dep in the
# exe, so the static-CRT question stays one (WINDOWS-PLAN §6).
ruzstd = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Both are already in Cargo.lock (pulled by wry 0.57) — declared
# directly for the webview TLS trust handler (tls_trust.rs, #376).
webkit2gtk = { version = "2.0.2", features = ["v2_6"] }
gio = "0.18"
