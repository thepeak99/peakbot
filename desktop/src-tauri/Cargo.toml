[package]
name = "peakbot-desktop"
version.workspace = true
edition.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
peakbot-desktop-core = { path = "../core" }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
# Both are already in Cargo.lock (pulled by wry 0.57) — declared
# directly for the webview TLS trust handler (tls_trust.rs, #376).
webkit2gtk = { version = "2.0.2", features = ["v2_6"] }
gio = "0.18"
