[package]
name = "peakbot-desktop-core"
version.workspace = true
edition.workspace = true
publish = false
[dependencies]
semver = "1.0.28"
url = "2.5"
ureq = { version = "3.4.2", default-features = false }
getrandom = "0.3.4"
directories-next = "2"      # same crate as peakbot's get_config_dir
serde = { version = "1", features = ["derive"] }
log = "0.4"
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
[dev-dependencies]
tempfile = "3.27"
# Test-only (T1): the `UiAction` wire-format test (§9.1 case 32) needs a
# JSON serializer. Not a production dep of core.
serde_json = "1"
