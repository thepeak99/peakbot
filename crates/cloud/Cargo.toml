# Shifu Cloud Mode — pbc1 protocol core (spec: /tmp/peakbot/design/cloud-protocol.md).
# PURE crate: no I/O, no tokio, no std::net. Randomness is always an
# explicit `rng: &mut R` parameter (spec §15.1); time is always a `now`
# parameter (spec §1.5). The main peakbot binary does NOT depend on this
# crate yet (P1 skeleton + RED tests).
[package]
name = "peakbot-cloud"
version = "0.1.0"
edition = "2024"
description = "pbc1 cloud protocol core: chain, SAS, links, letters, handshake, frames, relay codecs"

[lib]
name = "cloud"
path = "src/lib.rs"

[dependencies]
# bincode is the envelope encoding only (spec RULE E2): relay messages and
# the inner stream plaintext. Little-endian, standard config, decode limits.
bincode = { version = "=2.0.1", features = ["derive"] }
# The ONLY crypto source (spec): perma_crypto::v1 plus the A1–A6 additions.
# Private repo: CI needs a git auth step (PERMA_CRYPTO_TOKEN + insteadOf),
# same pattern as perma.sh. Locally: CARGO_NET_GIT_FETCH_WITH_CLI=true.
perma-crypto = { git = "https://git.patchnotes.com/ai-bots/perma-crypto.git", rev = "bb917b548f75922a2a3c39f9797798546ba8bd26" }
# Same major version perma-crypto depends on (rand 0.9 family).
rand_core = "=0.9.5"
thiserror = "=2.0.18"

[dev-dependencies]
# Pinned exactly per task rules: deterministic proptest runs.
proptest = "=1.7.0"
rand = "=0.9.2"
rand_chacha = "=0.9.0"
# sha2 (NOT sha3) is only for the spec §5.3 BIP-39 list hash assertion.
sha2 = "0.10"
