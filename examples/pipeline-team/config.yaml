# PeakBot Multi-Agent Pipeline — sample "software team" configuration
#
# One conversation, one agent you talk to: the ORCHESTRATOR. The orchestrator
# is simply your normal top-level agent (whatever `default_model` resolves to).
# It is NOT a pipeline role — do not list it under `pipeline.agents`.
#
# The orchestrator gets a `delegate(role, task)` tool (present only while
# `pipeline.enabled: true`). Each delegation runs one sub-agent to completion
# on a FRESH context and returns a single result string. You see every
# sub-agent's turns in the transcript, tagged `🧩 <role>`; the orchestrator
# sees only the string each delegation returns.
#
# Usage: copy to your config.yaml, drop in your API key, run `peakbot`.

# =============================================================================
# PROVIDERS — the models every agent (orchestrator + sub-agents) draws from
# =============================================================================
# Sub-agent roles below reference these aliases by name (same aliases `/model`
# uses). `default_model` is the orchestrator you talk to.
providers:
  - name: openrouter
    type: openrouter
    api_key: YOUR_API_KEY_HERE        # or set OPENROUTER_API_KEY
    models:
      - name: anthropic/claude-3.7-sonnet
        alias: sonnet
        max_tokens: 8192
      - name: anthropic/claude-3.5-sonnet
        alias: sonnet-3.5
      - name: google/gemini-2.0-flash-001
        alias: flash

default_model: sonnet                 # ← the orchestrator you chat with

# =============================================================================
# PIPELINE — the sub-agent roles the orchestrator can delegate to
# =============================================================================
# A role is (model alias, prompt) + optional per-role `env:`. That's the whole
# surface. Every sub-agent receives the full built-in toolset MINUS `delegate`
# (no nested delegation), so roles can read files, run bash, search, etc.
#
# Note there is NO `orchestrator` role here — the orchestrator is the
# top-level `default_model` agent above.
pipeline:
  enabled: true

  agents:
    pm:
      model: sonnet-3.5
      prompt: |
        You are the Product Manager. Turn a request into a tight product spec:
        problem statement, core user stories, in-scope vs out-of-scope, and
        success criteria. Be decisive; say "out of scope" when it is.

    architect:
      model: sonnet
      prompt: |
        You are the Software Architect. Given a spec, design the simplest
        system that solves it: components, data flow, interfaces, and the key
        tradeoffs. "Perfection is when there is nothing left to take away."

    developer:
      model: sonnet
      prompt: |
        You are the Developer. Implement the design as clean, boring,
        maintainable code. Explain WHY on non-obvious choices, handle errors
        gracefully, avoid premature abstraction and clever one-liners.

    tester:
      model: flash
      prompt: |
        You are the QA Engineer. Write tests that try to make the code fail:
        happy path AND edge cases (empty, max, null, error paths). Name each
        test by what it verifies. Report any bugs you spot with repro steps.
      env:
        # Per-role env is merged into THIS sub-agent's bash tool env only —
        # it never leaks into the orchestrator or other roles.
        RUN_INTEGRATION_TESTS: "1"
