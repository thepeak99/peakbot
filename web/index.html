<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Shifu</title>
    <link rel="icon" href="/logo_shifu.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a
      // flash. useTheme.ts mirrors this same decision into React state.
      (function () {
        try {
          var t = localStorage.getItem("peakbot-theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (t === "light") document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
