[package]
name = "peakbot"
version = "0.19.5"
edition = "2024"

[features]
mock = []

[dependencies]
rig-core = { version = "0.38", features = ["rmcp"] }
rmcp = { version = "1.6", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
http = "1"
chrono = "0.4"
directories-next = "2"
dirs = "6"
gethostname = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# Direct dep (transitive via ratatui) for terminal-cell-accurate `.width()` in
# the markdown renderer; same major as ratatui's use to keep deduping clean.
unicode-width = "0.2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async runtime
futures = "0.3.32"
bytes = "1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }

# PTY backend for `bash_bg` long-running background processes.
portable-pty = "0.9"

# `tokio_util::sync::CancellationToken` — the per-turn cancel handle
# the #183 design (`issue-183-design.md` §3.1) stores on `StateManager` and
# races against `agent.prompt_with_history` in `process_message_internal`.
# `sync` lives in tokio-util's default features (`tokio-util/src/lib.rs:57`),
# so no features need to be enabled. Already in `Cargo.lock:5610` at 0.7.18
# as a transitive dep via `rig-core`; this entry promotes it to direct so
# the stub `turn_cancel_token()` and the real implementation can name the
# type without a `cfg(test)` shim.
tokio-util = { version = "0.7" }

# MCP OAuth 2.1 (#19, src/mcp_auth.rs): one-shot localhost callback listener.
# The `query` extractor URL-decodes auto (Linear `%3A`-encodes the auth code).
# `ws` feature is for the default PeakBot WebSocket transport (src/ui/web/).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
# `peakbot --tls`: serve HTTPS with a self-signed CA PeakBot owns end to
# end. `axum-server` handles the rustls acceptor (incl. WS upgrades + graceful
# shutdown); `rcgen` mints the CA + leaf. Both route through the aws-lc-rs
# provider reqwest already links — no OpenSSL, so the cross-builds stay clean.
# `rustls` is promoted to a top-level dep (was android-only) because src/ui/web/
# tls.rs needs `ServerConfig` on every target.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Cross-platform browser launcher (xdg-open / open / cmd /c start).
open = "5"
# `rust-embed` embeds `web/dist/` at compile time. `release` builds inline
# the bytes; `cargo run` (debug) reads from disk so UI changes don't need a
# rebuild — matches the "frontend lives in a separate tool" model.
# `axum-embed` 0.1.0 is axum-0.7-only and unmaintained; we use the `axum`
# feature of `rust-embed` 8.x for first-party axum 0.8 support, plus a
# ~15-line hand-rolled handler that adds SPA fallback (route → index.html).
# ETag/304 + compression are deferred to Phase 4 (remote access).
rust-embed = "8"
mime_guess = "2"
# Required to impl rmcp's `#[async_trait] CredentialStore`.
async-trait = "0.1"

# `fetch_page` tool: one-shot fetch via `Page::new_page` + HTML→Markdown. No
# crawler; `reqwest_rustls_tls` dedupes spider's Client onto our reqwest 0.13.
# spider_transformations keeps default `serde` (its chunking module needs it).
spider = { version = "2.51", default-features = false, features = ["reqwest_rustls_tls"] }
spider_transformations = "2.39"

# Vector DB (doc_index / doc_search). `default-features = false` drops
# `api-embeddings` (dup reqwest 0.11) and `simd` (simsimd C lib) — both break
# the cross-compiles; we bring our own embeddings + pure-Rust distance. Ids are
# self-hashed (no `uuid-support`). Backends: hnsw_rs (index) + redb (storage).
ruvector-core = { version = "=2.2.0", default-features = false, features = ["hnsw", "storage", "parallel"] }
# PDF text + markdown extraction (pure-Rust). `legacy-crypto` keeps R<=4 RC4/MD5
# decrypt; all C-dep features (icc/lcms2/aws-lc/OCR/pdfium) stay off so it
# cross-compiles clean.
pdf_oxide = { version = "0.3", default-features = false, features = ["legacy-crypto"] }
# DOCX text extraction (pure-Rust; quick-xml + zip + thiserror).
docx-lite = "0.2"
# Already linked via `pdf_oxide` (Cargo.lock:2206) with exactly these codecs
# enabled — declaring it direct adds ZERO crates and ZERO compile time.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Chunk hashing for idempotent re-index.
sha2 = "0.10"

# Android-only TLS roots: reqwest 0.13's `rustls-platform-verifier` panics at
# runtime on Android (needs a JVM Context, reqwest#2968), so src/http.rs roots
# TLS in the bundled Mozilla certs. `rustls` itself is a top-level dep above.
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[dev-dependencies]
tempfile = "3.27"
insta = { version = "1.40", features = ["yaml", "serde", "filters"] }
peakbot = { path = ".", features = ["mock"] }
# Time-control helpers (`start_paused`, `tokio::time::advance`) for the
# paused-time writer tests (T8/T10) — gated behind a dev-only feature.
tokio = { version = "1", features = ["test-util"] }
# #183 — `tokio_util::sync::CancellationToken` is the type the design names
# in §5 for the per-turn cancellation token. It's a transitive dep today
# (via `rig-core`); we promote it to a dev-dep so the T5/T6 stub signatures
# can name the real type and the implementation task can drop the use in
# without changing any test code. `sync` is in tokio-util's default features
# (`tokio-util/src/lib.rs:57`), so no features need to be enabled.
tokio-util = { version = "0.7" }
