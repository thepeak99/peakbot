[package]
name = "peakbot"
version = "0.10.0"
edition = "2024"

[features]
mock = []

[dependencies]
rig-core = { version = "0.38", features = ["rmcp"] }
rmcp = { version = "1.6", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
http = "1"
chrono = "0.4"
directories-next = "2"
dirs = "6"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# Already pulled in transitively by ratatui; declare it directly so we can
# rely on `.width()` / `.width_cjk()` for terminal-cell-accurate sizing
# in the markdown renderer (emojis, CJK, combining chars). Pinning to
# the same major as ratatui's transitive use keeps deduping clean.
unicode-width = "0.2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async runtime
futures = "0.3.32"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }

# PTY backend for `bash_bg` (long-running background processes).
# Same crate the (future) interactive tool will use — keep this entry in
# sync with `terminal-uber-alles.md` when that lands.
portable-pty = "0.9"

# MCP OAuth 2.1 (#19, src/mcp_auth.rs). axum runs a one-shot localhost
# callback listener; the `Query<T>` extractor URL-decodes automatically
# (which the Slice 1.5 Linear spike showed matters — Linear `%3A`-encodes
# the `:` separators in the auth code). Default features off — we only
# need HTTP/1.1 + tokio runtime.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
# Cross-platform browser launcher (xdg-open / open / cmd /c start).
open = "5"
# Required to impl rmcp's `#[async_trait] CredentialStore`.
async-trait = "0.1"

# Single-page web fetch + HTML→Markdown for the `fetch_page` tool. We use
# spider purely for `Page::new_page(url, &reqwest::Client)` (one-shot fetch,
# NOT the crawler) and `spider_transformations::transform_content` for the
# markdown conversion. `default-features = false` drops chrome/sqlx/sysinfo;
# `reqwest_rustls_tls` aliases spider's `Client` to a plain `reqwest::Client`
# on rustls — the same reqwest 0.13 major peakbot already uses, so it dedupes.
# spider_transformations keeps its default `serde` feature (its chunking
# module fails to compile without it).
spider = { version = "2.51", default-features = false, features = ["reqwest_rustls_tls"] }
spider_transformations = "2.39"

# Vector DB (doc_index / doc_search tools). `default-features = false` drops
# ruvector's `api-embeddings` (a duplicate reqwest 0.11) and `simd` (the
# `simsimd` C lib) — both would break the mingw/zigbuild cross-compiles.
# We bring our own embeddings client and rely on ruvector's pure-Rust distance
# fallback. `uuid-support` is intentionally omitted: ids are self-assigned as a
# stable hash of (source, chunk_index) for idempotent re-index, so the DB never
# auto-generates uuids. Backends: hnsw_rs (index) + redb (persistence).
ruvector-core = { version = "=2.2.0", default-features = false, features = ["hnsw", "storage", "parallel"] }
# PDF text + markdown extraction (MIT/Apache, pure-Rust). default-features=false
# drops `icc` (qcms, colour-only); `legacy-crypto` keeps R<=4 RC4/MD5 decryption.
# All C-dep features (lcms2, aws-lc, OCR/ML, pdfium) stay off, so the graph
# cross-compiles clean to mingw/zig/android like the rest of the tree.
pdf_oxide = { version = "0.3", default-features = false, features = ["legacy-crypto"] }
# DOCX text extraction (MIT/Apache, pure-Rust; deps = quick-xml + zip + thiserror).
docx-lite = "0.2"
# Chunk hashing for idempotent re-index (stable id + content sha256).
sha2 = "0.10"

# Android-only TLS. On the NDK `aarch64-linux-android` target, reqwest 0.13's
# hard-wired `rustls-platform-verifier` panics at runtime (it needs a JVM
# `Context` to reach the system trust store, which a Termux/`adb shell` binary
# lacks — reqwest#2968). src/http.rs builds a rustls config from the bundled
# Mozilla roots and feeds it to every client via `use_preconfigured_tls`. This
# is gated to Android so desktop builds keep reqwest's default OS platform
# verifier unchanged. aws_lc_rs is already linked via reqwest's `rustls`
# feature, so naming the provider here adds no new C dependency.
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3.27"
insta = { version = "1.40", features = ["yaml", "serde", "filters"] }
peakbot = { path = ".", features = ["mock"] }
