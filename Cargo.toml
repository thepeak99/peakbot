[package]
name = "peakbot"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = { version = "0.31", features = ["rmcp"] }
rmcp = { version = "0.13", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
chrono = "0.4"
directories-next = "2"
dirs = "5"
serde_yaml = "0.9"
tiktoken-rs = "0.9"

[dev-dependencies]
tempfile = "3"
