[package]
name = "peakbot"
version = "0.4.4"
edition = "2024"

[features]
mock = []

[dependencies]
rig-core = { version = "0.36", features = ["rmcp"] }
rmcp = { version = "1.6", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
http = "1"
chrono = "0.4"
directories-next = "2"
dirs = "6"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# Already pulled in transitively by ratatui; declare it directly so we can
# rely on `.width()` / `.width_cjk()` for terminal-cell-accurate sizing
# in the markdown renderer (emojis, CJK, combining chars). Pinning to
# the same major as ratatui's transitive use keeps deduping clean.
unicode-width = "0.2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async runtime
futures = "0.3.32"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }

[dev-dependencies]
tempfile = "3.27"
insta = { version = "1.40", features = ["yaml", "serde"] }
peakbot = { path = ".", features = ["mock"] }
