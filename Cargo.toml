# One workspace, one lock: `mobile/src-tauri` joins here so
# the Local APK builds exactly the dependency set root CI tests.
# `default-members = ["."]` keeps plain `cargo build/test/clippy` (and root CI)
# on the root crate only — the mobile crate is always addressed with `-p`.
# `desktop/` stays its own workspace (desktop and mobile bump Tauri independently).
[workspace]
members = [".", "crates/cloud", "crates/relay", "mobile/src-tauri"]
default-members = ["."]

[package]
name = "peakbot"
version = "0.29.0"
edition = "2024"

[features]
mock = []
# `host` = everything that gives the agent hands on the machine: shell/PTY/bg,
# file + doc tools, MCP, the installer, the TUI and the CLI. Without it the
# crate is the Local edition PeakBot runs in-process on a phone.
default = ["host"]
# Cloud Mode (p3-design §A/§C): the OS keyring is the green-phase home of
# the seed/token. Its `sync-secret-service` backend needs the system
# `libdbus-1-dev` at build time, which the RED sandbox lacks — so the
# `keyring` CRATE is added in the green phase. The skeleton keeps
# `KeyringSeedStore` a stub (todo!() bodies, no keyring import) and the
# `FileSeedStore` 0600 fallback, so both editions compile now.
host = [
    "dep:portable-pty",
    "dep:rmcp",
    "rig-core/rmcp",
    "dep:ruvector-core",
    "dep:docx-lite",
    "dep:ratatui",
    "dep:crossterm",
    "dep:clap",
    "dep:open",
    "dep:libc",
    "dep:keyring",
    "dep:dbus-secret-service",
]

[[bin]]
name = "peakbot"
path = "src/main.rs"
required-features = ["host"]

# Integration targets that drive host-only surfaces (TUI, shell and bg
# tools, the installer) exist only in the host edition.
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["host"]

# P3 PR-C: CloudServe is host-only (§E), so are its inbound-hook tests and
# the host e2e. `cloud_controller_tests`/`cloud_boot_tests` run on both
# editions (no required-features); `cloud_local` gates itself with cfg.
[[test]]
name = "cloud_serve_tests"
path = "tests/cloud_serve_tests.rs"
required-features = ["host"]

[[test]]
name = "cloud_e2e"
path = "tests/cloud_e2e.rs"
required-features = ["host"]

[[test]]
name = "repl_tests"
path = "tests/repl_tests.rs"
required-features = ["host"]

[[test]]
name = "snapshot_helpers"
path = "tests/snapshot_helpers.rs"
required-features = ["host"]

[[test]]
name = "config_v2_runtime"
path = "tests/config_v2_runtime.rs"
required-features = ["host"]

[[test]]
name = "system_api_tests"
path = "tests/system_api_tests.rs"
required-features = ["host"]

[[test]]
name = "system_service_tests"
path = "tests/system_service_tests.rs"
required-features = ["host"]

[[test]]
name = "install_render_tests"
path = "tests/install_render_tests.rs"
required-features = ["host"]

# Local core contract: the `embed::LocalCore` boot/serve
# surface, the full `/ws` chat turn, and the shared `boot::web_boot` fn. The
# body is `#[cfg(not(feature = "host"))]` — the self dev-dependency
# (default-features = false, features = ["mock"]) keeps `mock` on for every
# test build, so the cfg is what keeps the default (host) build green.
# Run: cargo test --locked --no-default-features --features mock --test local_core
[[test]]
name = "local_core"
path = "tests/local_core.rs"
required-features = ["mock"]

[dependencies]
rig-core = "0.38"
rmcp = { version = "1.6", optional = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
tokio = { version = "1", features = ["full"] }
# pbc1 protocol core (Cloud Mode PR-B; p3-design §A): chain, handshake,
# frames, relay codecs. Non-optional — BOTH editions need it.
peakbot-cloud = { path = "crates/cloud" }
# The crypto source the enroll seams name in their signatures (same rev as
# `crates/cloud` — it must stay bit-identical).
perma-crypto = { git = "https://git.patchnotes.com/ai-bots/perma-crypto.git", rev = "bb917b548f75922a2a3c39f9797798546ba8bd26" }
# RNG trait for the login/enroll seams (`&mut impl CryptoRng`); the same
# 0.9 family perma-crypto depends on.
rand_core = "=0.9.5"
# CSPRNG for the actor (login state, seeds, backoff jitter): rand 0.9 is
# a dev-dependency, so the actor fills bytes through getrandom directly.
getrandom = "0.3"
# Zeroizing secret wrappers for cloud identity (p3-design §C).
zeroize = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["rustls", "stream"], default-features = false }
http = "1"
# `serde` declared here: it used to reach chrono only through a host dep.
chrono = { version = "0.4", features = ["serde"] }
directories-next = "2"
dirs = "6"
# Windows: `dunce::canonicalize` strips the verbatim `\\?\` prefix that
# `std::path::canonicalize` returns there, so the cwd picker never sees
# (or client-side `/`-concatenates onto) a verbatim path. Already in the
# lockfile transitively (via portable-pty) — this only promotes the edge.
dunce = "1"
gethostname = "1"
serde_yaml = "0.9"
# First-error path fidelity for the 0.24 config parse (spec §4.1):
# serde_yaml alone only reports line/column, not the YAML key path.
serde_path_to_error = "0.1"
# Remote-profile endpoint URLs (remote-profiles design T3); already in the
# lockfile transitively (via reqwest) — this only promotes the edge.
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Direct dep (transitive via url/reqwest) for the RFC 5987 `filename*`
# percent-encoding in the upload serve headers (src/ui/web/uploads.rs).
percent-encoding = "2.3"
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# Direct dep (transitive via ratatui) for terminal-cell-accurate `.width()` in
# the markdown renderer; same major as ratatui's use to keep deduping clean.
unicode-width = "0.2"

# CLI argument parsing
clap = { version = "4", optional = true, features = ["derive"] }

# Async runtime
futures = "0.3.32"
bytes = "1"
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }
ratatui = { version = "0.30.0", optional = true, features = ["unstable-rendered-line-info"] }

# PTY backend for `bash_bg` long-running background processes.
# Pinned to 0.8.1: 0.9 enables PSEUDOCONSOLE_INHERIT_CURSOR, which deadlocks
# ConPTY children unless the host answers ESC[6n (wezterm/portable-pty#6783).
portable-pty = { version = "=0.8.1", optional = true }

# `tokio_util::sync::CancellationToken` — the per-turn cancel handle
# the #183 design (`issue-183-design.md` §3.1) stores on `StateManager` and
# races against `agent.prompt_with_history` in `process_message_internal`.
# `sync` lives in tokio-util's default features (`tokio-util/src/lib.rs:57`),
# so no features need to be enabled. Already in `Cargo.lock:5610` at 0.7.18
# as a transitive dep via `rig-core`; this entry promotes it to direct so
# the stub `turn_cancel_token()` and the real implementation can name the
# type without a `cfg(test)` shim. `io` adds `StreamReader` for streaming
# URL-token downloads straight into the upload store (src/attachments.rs).
tokio-util = { version = "0.7", features = ["io"] }

# MCP OAuth 2.1 (#19, src/mcp_auth.rs): one-shot localhost callback listener.
# The `query` extractor URL-decodes auto (Linear `%3A`-encodes the auth code).
# `ws` feature is for the default PeakBot WebSocket transport (src/ui/web/).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws", "json"] }
# Cloud Mode CloudServe: `ServiceExt::oneshot` runs a tunnelled op through the
# same in-process router the HTTP routes use (already in the tree via axum).
tower = { version = "0.5", default-features = false, features = ["util"] }
# `peakbot --tls`: serve HTTPS with a self-signed CA PeakBot owns end to
# end. `axum-server` handles the rustls acceptor (incl. WS upgrades + graceful
# shutdown); `rcgen` mints the CA + leaf. Both route through the aws-lc-rs
# provider reqwest already links — no OpenSSL, so the cross-builds stay clean.
# `rustls` is promoted to a top-level dep (was android-only) because src/ui/web/
# tls.rs needs `ServerConfig` on every target.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Remote profiles (src/ui/web/remote/): the WS dial is TCP → tokio-rustls →
# `client_async`, so tungstenite needs only `handshake` plus the rustls
# `MaybeTlsStream` arm (its bundled webpki roots are never used — we pass our
# own config). Same feature set 0.28 already has in the lock: no new crate.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false }
# Leaf validity window (src/ui/web/tls.rs `leaf_validity`): `time` is already
# in the lock via rcgen/yasna — this only promotes the edge.
time = "0.3"
# Cross-platform browser launcher (xdg-open / open / cmd /c start).
open = { version = "5", optional = true }
# `rust-embed` embeds `web/dist/` at compile time. `release` builds inline
# the bytes; `cargo run` (debug) reads from disk so UI changes don't need a
# rebuild — matches the "frontend lives in a separate tool" model.
# `axum-embed` 0.1.0 is axum-0.7-only and unmaintained; we use the `axum`
# feature of `rust-embed` 8.x for first-party axum 0.8 support, plus a
# ~15-line hand-rolled handler that adds SPA fallback (route → index.html).
# ETag/304 + compression are deferred to Phase 4 (remote access).
rust-embed = "8"
mime_guess = "2"
# Required to impl rmcp's `#[async_trait] CredentialStore`.
async-trait = "0.1"

# `fetch_page` tool: one-shot fetch via `Page::new_page` + HTML→Markdown. No
# crawler; `reqwest_rustls_tls` dedupes spider's Client onto our reqwest 0.13.
# spider_transformations keeps default `serde` (its chunking module needs it).
spider = { version = "2.51", default-features = false, features = ["reqwest_rustls_tls"] }
spider_transformations = "2.39"

# Vector DB (doc_index / doc_search). `default-features = false` drops
# `api-embeddings` (dup reqwest 0.11) and `simd` (simsimd C lib) — both break
# the cross-compiles; we bring our own embeddings + pure-Rust distance. Ids are
# self-hashed (no `uuid-support`). Backends: FlatGraph index + redb storage.
ruvector-core = { version = "=2.4.0", optional = true, default-features = false, features = ["hnsw", "storage", "parallel"] }
# PDF text + markdown extraction (pure-Rust). `legacy-crypto` keeps R<=4 RC4/MD5
# decrypt; all C-dep features (icc/lcms2/aws-lc/OCR/pdfium) stay off so it
# cross-compiles clean.
pdf_oxide = { version = "0.3", default-features = false, features = ["legacy-crypto"] }
# DOCX text extraction (pure-Rust; quick-xml + zip + thiserror).
docx-lite = { version = "0.2", optional = true }
# Already linked via `pdf_oxide` (Cargo.lock:2206) with exactly these codecs
# enabled — declaring it direct adds ZERO crates and ZERO compile time.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Chunk hashing for idempotent re-index.
sha2 = "0.10"

# Unix process-group kill (src/pty_runner.rs): `killpg` is a raw syscall,
# so the group killer needs libc directly. Already in the lockfile (via
# portable-pty) — this only adds a dependency edge, no new crate.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# Cloud Mode (p3-design §C): the OS keyring (host only). Pinned exactly — the
# platform-native backend is selected per target so the other platforms'
# native crates (security-framework, windows-sys) never build here.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Same crate keyring pulls in, promoted: build libdbus from the vendored
# source instead of the system libdbus-1-dev (absent on headless servers).
# Secret Service platforms only — Android/iOS have no D-Bus to build for.
dbus-secret-service = { version = "=4.1.0", optional = true, features = ["vendored"] }

# Other unix (Android, iOS): no native backend feature, so keyring falls
# back to its mock store and `cloud::keyring` still compiles (host feature on).
[target.'cfg(not(any(target_os = "macos", windows, target_os = "linux", target_os = "freebsd", target_os = "openbsd")))'.dependencies]
keyring = { version = "=3.6.3", optional = true, default-features = false }

# Android-only TLS roots: reqwest 0.13's `rustls-platform-verifier` panics at
# runtime on Android (needs a JVM Context, reqwest#2968), so src/http.rs roots
# TLS in the bundled Mozilla certs. `rustls` itself is a top-level dep above.
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

# `http::system_tls_config()` hands the remote-profile WS dial the same OS
# verifier reqwest uses on desktop. Already in the lock via reqwest.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.6"

[dev-dependencies]
# Deterministic RNGs for the fake relay / test devices (spec §15.1 style:
# seeded ChaCha20Rng). Same 0.9 family perma-crypto depends on.
rand = "0.9"
rand_chacha = "0.9"
tempfile = "3.27"
insta = { version = "1.40", features = ["yaml", "serde", "filters", "json"] }
# `default-features = false`: with defaults on, this self edge would switch
# `host` back on and `--no-default-features` would silently test the host build.
peakbot = { path = ".", default-features = false, features = ["mock"] }
# Time-control helpers (`start_paused`, `tokio::time::advance`) for the
# paused-time writer tests (T8/T10) — gated behind a dev-only feature.
tokio = { version = "1", features = ["test-util"] }
# #183 — `tokio_util::sync::CancellationToken` is the type the design names
# in §5 for the per-turn cancellation token. It's a transitive dep today
# (via `rig-core`); we promote it to a dev-dep so the T5/T6 stub signatures
# can name the real type and the implementation task can drop the use in
# without changing any test code. `sync` is in tokio-util's default features
# (`tokio-util/src/lib.rs:57`), so no features need to be enabled.
tokio-util = { version = "0.7" }
# Leaf-validity test (src/ui/web/tls.rs): parse the minted leaf's
# notBefore/notAfter. Already in the lock via rcgen — this only adds a
# dev-only dependency edge, no new crate.
x509-parser = "0.18"
# Remote-profiles T4 E2E: `connect_async` (default `connect` feature) drives
# `/ws` in `src/ui/web/t4_tests.rs`; the lib dep above is handshake-only.
tokio-tungstenite = "0.29"
# P3 PR-C e2e: the REAL relay in-process (`peakbot_relay::serve`) plus the
# relay harness's `FakeIdp`/`TestRelay`, included by `#[path]` from
# `tests/cloud_common/relay_harness.rs` (self-contained single file — no
# feature flag, no copy). Dev-only edge: the prod dep never appears.
peakbot-relay = { path = "crates/relay" }
# The `#[path]`-included relay harness (crates/relay/tests/common/mod.rs)
# mints IdP keys: ES256 (p256/ecdsa/signature) and RS256 (rsa) — the same
# crates the relay's own dev-deps use, already in the lockfile.
ecdsa = "0.16"
signature = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = "0.9"
futures-util = "0.3"
# `rsa::pkcs1v15::SigningKey::<Sha256>` needs the digest OID (relay dev-deps do the same).
sha2 = { version = "0.10", features = ["oid"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
# `axum::extract::Form` (the harness's FakeIdp `/token` endpoint); unifies
# with the lib's axum features.
axum = { version = "0.8", default-features = false, features = ["form"] }
# `http_body_util::BodyExt` for the test server body collection (the relay
# tests use WebSocket frames, so they don't need this; the cloud TLS tests
# need to inspect HTTP POST body content).
http-body-util = "0.1"

# No debuginfo for test builds: cold codegen of the large lib test binary
# OOMs at debuginfo=2 (host and CI). Mirrors CI's CARGO_PROFILE_TEST_DEBUG=0.
[profile.test]
debug = false

# Vendored termios 0.2.2 carrying an `os::android` module that upstream 0.2.2
# lacks — the portable-pty 0.8.1 pin (must stay) pulls serial 0.4.0 →
# serial-unix 0.4.0 → termios 0.2.2, which failed Android cross-compiles.
# See vendor/README.md. Patches only the 0.2.x semver line; termwiz's
# termios 0.3.3 is untouched.
[patch.crates-io]
termios = { path = "vendor/termios-0.2.2" }
