# PeakBot Mobile — the Tauri 2 shell. Member of the root
# workspace: one Cargo.lock, `--locked` everywhere.
[package]
name = "peakbot-mobile"
version = "0.28.0"
edition = "2024"
publish = false

[lib]
name = "peakbot_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
# The nav guard's URL parsing and the error page's fragment encoding.
url = "2"
percent-encoding = "2"
# The Local core: the root crate compiled without `host`. One app,
# one artifact — no `local` feature.
peakbot = { path = "../..", default-features = false }
# local.rs: the core's loopback listener + readiness probe (Tauri's runtime is
# tokio), the per-launch token from the OS RNG, and boot's error type. All
# already in the lock via the core.
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
getrandom = "0.4"
anyhow = "1"
# The core reads `web/dist` from disk in debug builds; a phone has no such
# path, so the app embeds the SPA in every profile (feature unification).
rust-embed = { version = "8", features = ["debug-embed"] }

# QR pairing (CAMERA via the barcode plugin) — mobile targets only.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# iOS glue: the WKWebView edge-swipe back gesture + the
# NSURLIsExcludedFromBackupKey resource value on the data root — the raw
# Objective-C bridge, iOS only. wry already pulls both crates for iOS; the
# extra `NSError` feature unlocks NSURL::setResourceValue:forKey:error:.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError"] }

[dev-dependencies]
# The capability tests read the ACL files.
serde_json = "1"
