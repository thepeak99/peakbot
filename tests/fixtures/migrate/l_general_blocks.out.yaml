providers:
  - name: openai
    type: openai
    api_key: fake-key
    models:
      - name: fake-model
        alias: solo
profiles:
  default:
    fetch_url:
      allow_post: true
    memory:
      enabled: false
      threshold_bytes: 1024
    agents:
      main:
        model: solo
general:
  web:
    tls: true
    session_ttl_secs: 300
    reaper_tick_secs: 30
  search:
    base_url: https://search.example.com
    bearer_token: tok
  context:
    enabled: true
    threshold: 0.5
    keep_recent: 3
    compaction_model: solo
  conversation:
    auto_save: false
    storage_dir: /tmp/convos
  agent_max_turns: 20
  cost_tracking: false
  retry:
    max_retries: 5
  timeouts:
    tool_secs: 60
    delegate_secs: 120
  http:
    connect_timeout_secs: 10
    read_timeout_secs: 100
  uploads:
    max_file_mb: 5
    max_files: 3
