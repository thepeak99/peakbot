providers:
  - name: openai
    type: openai
    api_key: fake-key
    models:
      - name: fake-model
        alias: solo
profiles:
  default:
    agents:
      main:
        model: solo
      main-2:
        model: solo
        persona: The main team lead.
        prompt: Run the main team.
        subagents:
          worker:
            prompt: Work.
  default-2:
    tools:
      only: [web_search]
    agents:
      main:
        model: solo
      main-2:
        model: solo
        persona: The main team lead.
        prompt: Run the main team.
        subagents:
          worker:
            prompt: Work.
