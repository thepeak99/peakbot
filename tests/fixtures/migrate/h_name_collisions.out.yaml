providers:
  - name: openai
    type: openai
    api_key: fake-key
    models:
      - name: fake-model
        alias: solo
profiles:
  default:
    agents:
      main:
        model: solo
      main-3:
        model: solo
        persona: The main team lead.
        prompt: Run the main team.
        subagents:
          worker:
            prompt: Work.
      main-2:
        model: solo
        persona: The second lead.
        prompt: The second main.
      dev:
        model: solo
        persona: The first dev.
        prompt: Dev one.
      dev-2:
        model: solo
        persona: The second dev.
        prompt: Dev two.
      team:
        model: solo
        persona: The team lead.
        prompt: The team pipeline.
      team-2:
        model: solo
        prompt: The legacy team block.
